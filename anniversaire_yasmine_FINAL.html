<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyeux Anniversaire Yasmine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,serif;overflow:hidden;width:100vw;height:100vh;background:#1a6b2a}
#scene{position:absolute;width:100%;height:100%;background:linear-gradient(to bottom,#87CEEB 0%,#b0e0f5 35%,#5db45d 35%,#3a8a3a 50%,#2d7a2d 100%)}
.cloud{position:absolute;background:white;border-radius:50px;opacity:.85;animation:moveClouds linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:white;border-radius:50%}
.cloud-1{width:120px;height:40px;top:40px;animation-duration:60s}
.cloud-1::before{width:60px;height:60px;top:-30px;left:20px}
.cloud-1::after{width:45px;height:45px;top:-20px;left:55px}
.cloud-2{width:90px;height:30px;top:70px;animation-duration:80s;animation-delay:-20s}
.cloud-2::before{width:45px;height:45px;top:-22px;left:15px}
.cloud-2::after{width:35px;height:35px;top:-15px;left:45px}
.cloud-3{width:150px;height:50px;top:25px;animation-duration:70s;animation-delay:-40s}
.cloud-3::before{width:70px;height:70px;top:-35px;left:25px}
.cloud-3::after{width:55px;height:55px;top:-25px;left:75px}
@keyframes moveClouds{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.sun{position:absolute;width:70px;height:70px;background:radial-gradient(circle,#FFE44D,#FFA500);border-radius:50%;top:30px;right:10%;box-shadow:0 0 40px 15px rgba(255,220,0,.4);animation:sunPulse 3s ease-in-out infinite}
@keyframes sunPulse{0%,100%{box-shadow:0 0 40px 15px rgba(255,220,0,.4)}50%{box-shadow:0 0 60px 25px rgba(255,220,0,.6)}}
.tree{position:absolute;bottom:0}
.flower{position:absolute;bottom:0;font-size:1.4em;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.butterfly{position:absolute;font-size:1.6em;animation:flyB 12s ease-in-out infinite}
@keyframes flyB{0%{transform:translate(0,0)}25%{transform:translate(80px,-40px)}50%{transform:translate(30px,-80px)}75%{transform:translate(-50px,-30px)}100%{transform:translate(0,0)}}
.bird{position:absolute;font-size:1.2em;animation:birdFly 22s linear infinite}
@keyframes birdFly{from{transform:translateX(-100px);opacity:0}5%{opacity:1}95%{opacity:1}to{transform:translateX(110vw);opacity:0}}
.grass-strip{position:absolute;bottom:0;width:100%;height:70px;background:linear-gradient(to bottom,#4caf50,#2e7d32);border-radius:60% 60% 0 0/20px 20px 0 0}
#photo-area{position:absolute;bottom:75px;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:0 15px}
.photo-frame{border:5px solid white;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.5);overflow:hidden;flex-shrink:0;animation:frameAppear 1s ease forwards,photoFloat 4s ease-in-out infinite;opacity:0;background:#fff}
.photo-frame img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes frameAppear{from{opacity:0;transform:translateY(60px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes photoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.photo-frame:nth-child(1){animation-delay:.2s,.2s;width:155px;height:105px}
.photo-frame:nth-child(2){animation-delay:.5s,.5s;width:170px;height:115px}
.photo-frame:nth-child(3){animation-delay:.8s,.8s;width:185px;height:125px;border-color:#FFD700;border-width:6px}
.photo-frame:nth-child(4){animation-delay:1.1s,1.1s;width:170px;height:115px}
.photo-frame:nth-child(5){animation-delay:1.4s,1.4s;width:160px;height:108px}
.photo-frame:nth-child(6){animation-delay:1.7s,1.7s;width:150px;height:100px}
#lyrics-area{position:absolute;top:8px;left:0;right:0;text-align:center}
.lyric-line{font-size:clamp(1.4em,3.5vw,2.4em);font-weight:bold;color:white;text-shadow:0 0 20px rgba(255,215,0,.9),2px 2px 0 #8B0000,-1px -1px 0 #8B0000;letter-spacing:2px;display:inline-block;animation:lyricPop .5s ease forwards;padding:8px 20px;background:rgba(0,0,0,.25);border-radius:12px}
@keyframes lyricPop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
#title-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:100;animation:bannerFade 4s ease forwards}
@keyframes bannerFade{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
#title-banner h1{font-size:clamp(2em,6vw,4.5em);color:#FFD700;text-shadow:3px 3px 0 #8B0000,0 0 30px rgba(255,100,0,.8);line-height:1.1}
#title-banner h2{font-size:clamp(1.5em,4vw,3em);color:white;text-shadow:2px 2px 0 #006600}
.confetti-piece{position:absolute;top:-20px;animation:confettiFall linear infinite;border-radius:2px;z-index:200}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.music-note{position:absolute;font-size:2em;animation:noteFloat 3s ease-in-out infinite;z-index:50}
@keyframes noteFloat{0%{transform:translateY(0) scale(1);opacity:.8}50%{transform:translateY(-40px) scale(1.2) rotate(15deg);opacity:1}100%{transform:translateY(-80px) scale(.5);opacity:0}}
#cake-display{position:absolute;left:50%;transform:translateX(-50%);font-size:3em;bottom:80px;display:none;animation:cakeBounce .6s ease-in-out infinite alternate;z-index:60}
@keyframes cakeBounce{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.15)}}
.balloon{position:absolute;width:45px;height:55px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;animation:balloonRise linear infinite;opacity:.85}
.balloon::after{content:'';position:absolute;bottom:-20px;left:50%;width:1px;height:20px;background:rgba(0,0,0,.4);transform:translateX(-50%)}
@keyframes balloonRise{0%{transform:translateY(110vh) rotate(-5deg);opacity:0}5%{opacity:.85}95%{opacity:.85}100%{transform:translateY(-100px) rotate(5deg);opacity:0}}
#final-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;z-index:300;background:rgba(0,0,0,.6);border:4px solid #FFD700;border-radius:20px;padding:25px 40px;width:90%;max-width:500px}
#final-msg h1{font-size:clamp(1.8em,5vw,3.2em);color:#FFD700;text-shadow:2px 2px 0 #8B0000}
#final-msg p{font-size:clamp(1em,2.5vw,1.6em);color:white;margin-top:8px;text-shadow:1px 1px 2px black}
#final-msg .hearts{font-size:2em;display:block;margin-top:10px;animation:heartBeat .8s ease-in-out infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
#progress-bar{position:absolute;bottom:0;left:0;height:5px;background:linear-gradient(to right,#FFD700,#FF6600);width:0%;transition:width .5s linear;z-index:400}
</style>
</head>
