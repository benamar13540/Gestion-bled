<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyeux Anniversaire Yasmine 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;
    overflow: hidden;
    width: 1280px;
    height: 720px;
    background: #1a6b2a;
  }

  /* ===== PARK BACKGROUND ===== */
  #scene {
    position: absolute;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      #87CEEB 0%,
      #b0e0f5 35%,
      #5db45d 35%,
      #3a8a3a 50%,
      #2d7a2d 100%
    );
  }

  /* Clouds */
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.85;
    animation: moveClouds linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud-1 { width: 120px; height: 40px; top: 40px; animation-duration: 60s; animation-delay: 0s; }
  .cloud-1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud-1::after  { width: 45px; height: 45px; top: -20px; left: 55px; }

  .cloud-2 { width: 90px; height: 30px; top: 70px; animation-duration: 80s; animation-delay: -20s; }
  .cloud-2::before { width: 45px; height: 45px; top: -22px; left: 15px; }
  .cloud-2::after  { width: 35px; height: 35px; top: -15px; left: 45px; }

  .cloud-3 { width: 150px; height: 50px; top: 25px; animation-duration: 70s; animation-delay: -40s; }
  .cloud-3::before { width: 70px; height: 70px; top: -35px; left: 25px; }
  .cloud-3::after  { width: 55px; height: 55px; top: -25px; left: 75px; }

  @keyframes moveClouds {
    from { transform: translateX(-200px); }
    to   { transform: translateX(1400px); }
  }

  /* Sun */
  .sun {
    position: absolute;
    width: 70px; height: 70px;
    background: radial-gradient(circle, #FFE44D, #FFA500);
    border-radius: 50%;
    top: 30px; right: 120px;
    box-shadow: 0 0 40px 15px rgba(255,220,0,0.4);
    animation: sunPulse 3s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100% { box-shadow: 0 0 40px 15px rgba(255,220,0,0.4); }
    50%      { box-shadow: 0 0 60px 25px rgba(255,220,0,0.6); }
  }

  /* Trees */
  .tree {
    position: absolute;
    bottom: 0;
  }
  .tree-trunk {
    background: #8B5E3C;
    margin: 0 auto;
    border-radius: 3px;
  }
  .tree-top {
    border-left: solid transparent;
    border-right: solid transparent;
    border-bottom: solid;
    margin: 0 auto;
  }
  .tree-top2 {
    border-left: solid transparent;
    border-right: solid transparent;
    border-bottom: solid;
    margin: 0 auto;
    margin-top: -20px;
  }

  /* Flowers */
  .flower {
    position: absolute;
    bottom: 0;
    font-size: 1.4em;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: rotate(-5deg); }
    50%      { transform: rotate(5deg); }
  }

  /* Butterflies */
  .butterfly {
    position: absolute;
    font-size: 1.6em;
    animation: flyButterfly 12s ease-in-out infinite;
  }
  @keyframes flyButterfly {
    0%   { transform: translate(0,0) rotate(0deg); }
    25%  { transform: translate(80px,-40px) rotate(15deg); }
    50%  { transform: translate(30px,-80px) rotate(-10deg); }
    75%  { transform: translate(-50px,-30px) rotate(5deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }

  /* Birds */
  .bird {
    position: absolute;
    font-size: 1.2em;
    animation: birdFly 20s linear infinite;
  }
  @keyframes birdFly {
    from { transform: translateX(-100px); opacity:0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    to   { transform: translateX(1400px); opacity:0; }
  }

  /* Grass blades */
  .grass-strip {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 80px;
    background: linear-gradient(to bottom, #4caf50, #2e7d32);
    border-radius: 60% 60% 0 0 / 20px 20px 0 0;
  }

  /* ===== PHOTO FRAMES ===== */
  #photo-area {
    position: absolute;
    bottom: 85px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 12px;
    padding: 0 20px;
  }

  .photo-frame {
    border: 5px solid white;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    overflow: hidden;
    flex-shrink: 0;
    animation: frameAppear 1s ease forwards, photoFloat 4s ease-in-out infinite;
    opacity: 0;
    transform-origin: bottom center;
    background: #fff;
  }

  .photo-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @keyframes frameAppear {
    from { opacity: 0; transform: translateY(60px) scale(0.8); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes photoFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .photo-frame:nth-child(1) { animation-delay: 0.2s, 0.2s; width: 170px; height: 115px; }
  .photo-frame:nth-child(2) { animation-delay: 0.5s, 0.5s; width: 185px; height: 125px; }
  .photo-frame:nth-child(3) { animation-delay: 0.8s, 0.8s; width: 200px; height: 135px; border-color: #FFD700; border-width: 6px; }
  .photo-frame:nth-child(4) { animation-delay: 1.1s, 1.1s; width: 185px; height: 125px; }
  .photo-frame:nth-child(5) { animation-delay: 1.4s, 1.4s; width: 175px; height: 115px; }
  .photo-frame:nth-child(6) { animation-delay: 1.7s, 1.7s; width: 165px; height: 110px; }

  /* ===== SONG LYRICS ===== */
  #lyrics-area {
    position: absolute;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding-top: 10px;
  }

  .lyric-line {
    font-size: 2.4em;
    font-weight: bold;
    color: white;
    text-shadow:
      0 0 20px rgba(255,215,0,0.9),
      2px 2px 0 #8B0000,
      -1px -1px 0 #8B0000;
    letter-spacing: 2px;
    display: none;
    animation: lyricPop 0.5s ease forwards;
    font-family: 'Georgia', serif;
    padding: 8px 20px;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    margin: 0 auto;
    display: inline-block;
  }

  @keyframes lyricPop {
    0%   { transform: scale(0.5); opacity: 0; }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Title banner */
  #title-banner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 100;
    animation: bannerFade 4s ease forwards;
  }
  @keyframes bannerFade {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
    20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.05); }
    80%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.2); }
  }
  #title-banner h1 {
    font-size: 4.5em;
    color: #FFD700;
    text-shadow: 3px 3px 0 #8B0000, 0 0 30px rgba(255,100,0,0.8);
    font-family: Georgia, serif;
    line-height: 1.1;
  }
  #title-banner h2 {
    font-size: 3em;
    color: white;
    text-shadow: 2px 2px 0 #006600, 0 0 20px rgba(0,200,0,0.5);
  }

  /* Confetti */
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    top: -20px;
    animation: confettiFall linear infinite;
    border-radius: 2px;
    z-index: 200;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(800px) rotate(720deg); opacity: 0; }
  }

  /* Notes de musique */
  .music-note {
    position: absolute;
    font-size: 2em;
    animation: noteFloat 3s ease-in-out infinite;
    z-index: 50;
  }
  @keyframes noteFloat {
    0%   { transform: translateY(0) scale(1); opacity: 0.8; }
    50%  { transform: translateY(-40px) scale(1.2) rotate(15deg); opacity: 1; }
    100% { transform: translateY(-80px) scale(0.5); opacity: 0; }
  }

  /* Cake emoji bounce */
  #cake-display {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3.5em;
    bottom: 90px;
    display: none;
    animation: cakeBounce 0.6s ease-in-out infinite alternate;
    z-index: 60;
  }
  @keyframes cakeBounce {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.15); }
  }

  /* Balloons */
  .balloon {
    position: absolute;
    width: 45px; height: 55px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    animation: balloonRise linear infinite;
    opacity: 0.85;
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 50%;
    width: 1px; height: 20px;
    background: rgba(0,0,0,0.4);
    transform: translateX(-50%);
  }
  @keyframes balloonRise {
    0%   { transform: translateY(750px) rotate(-5deg); opacity:0; }
    5%   { opacity: 0.85; }
    95%  { opacity: 0.85; }
    100% { transform: translateY(-100px) rotate(5deg); opacity:0; }
  }

  /* Final message */
  #final-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: none;
    z-index: 300;
    background: rgba(0,0,0,0.5);
    border: 4px solid #FFD700;
    border-radius: 20px;
    padding: 30px 50px;
    animation: finalAppear 1s ease forwards;
  }
  @keyframes finalAppear {
    from { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
    to   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
  #final-msg h1 {
    font-size: 3.5em;
    color: #FFD700;
    text-shadow: 2px 2px 0 #8B0000;
  }
  #final-msg p {
    font-size: 1.8em;
    color: white;
    margin-top: 10px;
    text-shadow: 1px 1px 2px black;
  }
  #final-msg .hearts {
    font-size: 2.5em;
    display: block;
    margin-top: 10px;
    animation: heartBeat 0.8s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.2); }
  }

  /* Progress bar */
  #progress-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 5px;
    background: linear-gradient(to right, #FFD700, #FF6600);
    width: 0%;
    transition: width 0.5s linear;
    z-index: 400;
  }
</style>
</head>

<script>
// ===== CONFETTI =====
const colors = ['#FF6B6B','#FFD700','#4CAF50','#2196F3','#FF69B4','#FF4500','#9C27B0','#00BCD4'];
function createConfetti(count) {
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.classList.add('confetti-piece');
    c.style.left = Math.random() * 1280 + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (Math.random() * 10 + 6) + 'px';
    c.style.height = (Math.random() * 8 + 5) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDuration = (Math.random() * 4 + 3) + 's';
    c.style.animationDelay = (Math.random() * 5) + 's';
    document.body.appendChild(c);
  }
}

// ===== BALLOONS =====
function createBalloons() {
  const balloonColors = ['#FF6B6B','#FFD700','#4CAF50','#2196F3','#FF69B4','#FF4500','#9C27B0'];
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.classList.add('balloon');
    b.style.left = (Math.random() * 1200 + 40) + 'px';
    b.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];
    b.style.animationDuration = (Math.random() * 8 + 6) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    document.body.appendChild(b);
  }
}

// ===== LYRICS TIMELINE =====
// Total duration: ~60 seconds
// Happy Birthday song × 2 + outro
const lyrics = [
  // verse 1
  { t: 4000,  text: '🎵 Happy Birthday to you 🎵' },
  { t: 7500,  text: '🎵 Happy Birthday to you 🎵' },
  { t: 11000, text: '🎵 Happy Birthday dear Yasmine 🎵' },
  { t: 15000, text: '🎵 Happy Birthday to you ! 🎵' },
  // verse 2
  { t: 20000, text: '🎶 Happy Birthday to you 🎶' },
  { t: 23500, text: '🎶 Happy Birthday to you 🎶' },
  { t: 27000, text: '🎶 Happy Birthday dear Yasmine 🎶' },
  { t: 31000, text: '🎶 Happy Birthday to you ! 🎶' },
  // verse 3 (final)
  { t: 36000, text: '✨ Hip hip hip... Hourra ! ✨' },
  { t: 39500, text: '✨ Hip hip hip... Hourra ! ✨' },
  { t: 43000, text: '✨ Hip hip hip... Hourra ! ✨' },
  { t: 47000, text: '🥳 Joyeux Anniversaire Yasmine ! 🥳' },
  { t: 51000, text: '' },
];

const TOTAL_DURATION = 58000;

function showLyric(text) {
  const el = document.getElementById('lyric');
  if (!text) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'inline-block';
  el.style.animation = 'none';
  el.textContent = text;
  void el.offsetWidth; // reflow
  el.style.animation = 'lyricPop 0.5s ease forwards';
}

function updateProgressBar(elapsed) {
  const pct = Math.min(100, (elapsed / TOTAL_DURATION) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
}

// ===== MAIN SEQUENCE =====
let startTime = null;
let lyricIndex = 0;

function tick(ts) {
  if (!startTime) startTime = ts;
  const elapsed = ts - startTime;

  updateProgressBar(elapsed);

  // Show lyrics
  while (lyricIndex < lyrics.length && elapsed >= lyrics[lyricIndex].t) {
    showLyric(lyrics[lyricIndex].text);
    lyricIndex++;
  }

  if (elapsed < TOTAL_DURATION) {
    requestAnimationFrame(tick);
  }
}

// Hide title banner after 3.5s, start song
setTimeout(() => {
  const banner = document.getElementById('title-banner');
  banner.style.display = 'none';

  // Show music notes
  ['note1','note2','note3','note4','note5'].forEach(id => {
    document.getElementById(id).style.display = 'block';
  });

  // Show cake
  document.getElementById('cake-display').style.display = 'block';

  requestAnimationFrame(tick);
}, 3500);

// Show final message at end
setTimeout(() => {
  showLyric('');
  const msg = document.getElementById('final-msg');
  msg.style.display = 'block';
  createConfetti(80);
}, 53000);

// Init
createConfetti(40);
createBalloons();

// Re-spawn confetti bursts during song
setTimeout(() => createConfetti(30), 15000);
setTimeout(() => createConfetti(30), 31000);
setTimeout(() => createConfetti(50), 47000);
</script>
